services: 
  postgresql:
    image: "mirror.gcr.io/postgres:15"
    restart: on-failure
    hostname: postgresql
    environment:
      - POSTGRES_PASSWORD=postgres
    expose:
      - "5432"
    volumes:
      - ./db-data/pgdata:/var/lib/postgresql/data
      - ./db-data/etc:/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      start_period: 10s
  redis:
    image: "mirror.gcr.io/redis:8-alpine"
    restart: on-failure
    hostname: redis
    expose:
      - "6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      start_period: 10s
  build:
    build:
      context: .
      dockerfile: build.Dockerfile
    volumes:
      - build-go-path:/root/go
      - .:/mnt-src
      - main-binary:/mnt-main
      - main-test-binary:/mnt-main-test
  blog:
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      build:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8081"
      - "50051"
    ports:
      - "8081:8081"
      - "50051:50051"
    volumes:
      - main-binary:/mnt/
      - ./swagger-ui:/mnt/swagger-ui
      - ./gen/blog.swagger.json:/mnt/gen/blog.swagger.json
  blog-test:
    depends_on:
      redis:
        condition: service_healthy
      build:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: [ "./main-test" ]
    volumes:
      - main-test-binary:/mnt/

volumes:
  main-binary:
  main-test-binary:
  build-go-path:
